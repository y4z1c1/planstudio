# HTML/JS must always revalidate (ETag/304 keeps it cheap) — otherwise
# Cloudflare applies its 4h default TTL and browsers keep stale app code
# after a deploy. Heavy immutable-ish assets get a day.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~* \.(glb|png|jpg|woff2?)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
