name: Deploy

# CI builds the static-site image, pushes it to GHCR, then tells Coolify to
# pull and redeploy.
#
#   push to main -> image :latest -> Coolify app (plan.yusufanilyazici.com)
#
# Auto-deploy fires only if the COOLIFY_* secrets are set; otherwise the image
# is built and you click Redeploy in Coolify (semi-auto).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Coolify webhook (if configured)
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_URL:-}" ]; then
            echo "COOLIFY_URL not set — falling through to SSH deploy."
            exit 0
          fi
          curl --fail --silent --show-error \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
          echo "Triggered Coolify deploy."

      - name: Deploy via SSH (git pull on the server)
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${COOLIFY_URL:-}" ]; then
            echo "Coolify webhook already handled the deploy."
            exit 0
          fi
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "No deploy method configured — image built & pushed only."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          # the key is restricted on the server to /opt/planstudio/deploy.sh
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "root@${DEPLOY_HOST}" deploy
